<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Рулетка завдань</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Прозорий фон для OBS / Streamlabs */
  html,body{margin:0;background:transparent;overflow:hidden;font-family:'Exo 2',"Segoe UI",Arial,sans-serif}
  #stage{position:fixed;left:50%;top:50%;width:1140px;box-sizing:border-box;padding:24px 20px;border-radius:16px;
    background:radial-gradient(ellipse at 50% 30%,#1b2150,#070914 75%);
    transform:translate(-50%,-50%) scale(var(--s,1));opacity:0;transition:opacity .9s ease}
  #stage.on{opacity:1}
  #who{color:#f5c14b;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;text-align:center;margin-bottom:12px;letter-spacing:1px}
  #win{transition:opacity .35s;position:relative;height:170px;overflow:hidden;border:4px solid #f5c14b;border-radius:12px;background:#05060f;box-shadow:0 0 24px rgba(245,193,75,.45)}
  #win::before,#win::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
  #win::before{left:0;background:linear-gradient(90deg,#05060f,transparent)}
  #win::after{right:0;background:linear-gradient(270deg,#05060f,transparent)}
  .bulb{position:absolute;left:0;right:0;height:14px;z-index:4;background:radial-gradient(circle,#ffd36b 0 4px,transparent 5px) 0 0/22px 14px repeat-x}
  #pointer{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#ff3b3b;z-index:3;box-shadow:0 0 14px 2px #ff3b3b}
  #strip{display:flex;align-items:center;gap:10px;height:100%;will-change:transform}
  .it{flex:0 0 140px;height:120px;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#fff;font-weight:600;font-size:16px;
    border:2px solid var(--c);border-radius:10px;background:rgba(255,255,255,.03);text-shadow:0 0 8px var(--c);box-shadow:0 0 12px var(--c),inset 0 0 12px var(--c)}

  {name:'Присідаю 50 разів',          w:3, c:'#fff200'},
  {name:'Ще один прокрут',          w:6,  c:'#ff2bd6', extra:true},   // бонус: крутиться ще раз
  {name:'Танцюю під ваш трек',         w:1,  c:'#fff200'}
];
/* ========================= */

/* ===== ЗВУК (генерується в коді, окремих файлів немає) =====
   Гучність: у посиланні ?vol=0.5 (від 0 до 1). ?vol=0 вимикає звук. */
const VOL = P.has('vol') ? Math.max(0, Math.min(1, Number(P.get('vol'))||0)) : 0.6;
let actx = null;
function audio(){
  if(VOL===0) return null;
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==='suspended') actx.resume().catch(()=>{});
  return actx;
}
// Браузер вмикає звук лише після першої дії на сторінці
['pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, () => { audio(); renderSt(); }));
function tone(freq, dur, type='sine', gain=0.3, delay=0, slideTo){
  const c = audio(); if(!c || c.state!=='running') return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain*VOL), t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
}
const sfx = {
  tick(){ tone(850+Math.random()*140, 0.05, 'square', 0.16); },                       // картка проїхала під стрілкою
  win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, 0.4, 'triangle', 0.35, i*0.09)); },
  bonus(){ tone(420, 0.5, 'sawtooth', 0.16, 0, 1250); tone(1320, 0.35, 'triangle', 0.3, 0.4); tone(1760, 0.45, 'triangle', 0.3, 0.55); }
};

const $ = id => document.getElementById(id);
const strip=$('strip'), stage=$('stage'), win=$('win');
function pick(allowExtra=true){
  const list = allowExtra ? PRIZES : PRIZES.filter(p=>!p.extra);
  let r = Math.random()*list.reduce((a,p)=>a+p.w,0);
  for(const p of list){ if((r-=p.w)<0) return p; }
  return list[0];
}

const queue=[]; let busy=false;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function fit(){ stage.style.setProperty('--s', Math.min(1, innerWidth/1180)); }
addEventListener('resize', fit); fit();

function build(allowExtra=true){
  const items = Array.from({length:80}, () => pick(allowExtra));
  strip.style.transition='none'; strip.style.transform='translateX(0)';
  strip.innerHTML = items.map(p=>`<div class="it" style="--c:${p.c}">${p.name}</div>`).join('');
  $('res').textContent=''; win.style.opacity=1;
  return items;
}
// Крутить стрічку і повертає приз тільки коли вона ПОВНІСТЮ зупинилась
async function go(items){
  await sleep(700);
  const stopIdx = 55 + Math.floor(Math.random()*15);
  const target = stopIdx*ITEM_W + Math.random()*(ITEM_W-24) + 12;   // точка під стрілкою
  const shift  = target - win.clientWidth/2;
  const stopped = new Promise(res => {
    let fin=false;
    const done = () => { if(!fin){ fin=true; strip.removeEventListener('transitionend', h); res(); } };
    const h = e => { if(e.target===strip && e.propertyName==='transform') done(); };
    strip.addEventListener('transitionend', h);
    setTimeout(done, SPIN_MS + 2000);                       // запасний варіант
  });
  strip.getBoundingClientRect();
  strip.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.12,.6,.1,1)`;
  strip.style.transform  = `translateX(${-shift}px)`;
  // Клацання: щоразу, коли чергова картка проїжджає під стрілкою
  let last = -1, raf;
  const loop = () => {
    const tr = getComputedStyle(strip).transform || '';
    let x = 0, m;
    if((m = /matrix\(([^)]+)\)/.exec(tr))) x = -parseFloat(m[1].split(',')[4]);
    else if((m = /translateX\((-?[\d.]+)px\)/.exec(tr))) x = -parseFloat(m[1]);
    const idx = Math.floor((x + win.clientWidth/2) / ITEM_W);
    if(last >= 0 && idx !== last) sfx.tick();
    last = idx; raf = requestAnimationFrame(loop);
  };
  loop();
  await stopped;
  cancelAnimationFrame(raf);
  await sleep(700);                                          // пауза: бачимо, що точно зупинилось
  const prize = items[stopIdx];
  strip.children[stopIdx].classList.add('w');
  $('res').textContent = prize.name;
  if(prize.extra) sfx.bonus(); else sfx.win();
  return prize;
}
async function run({id, name='Хтось', amount=0, count=1}){
  busy = true;
  count = Math.max(1, Math.min(5, Number(count)||1));
  const prizes = []; let first = true;
  for(let i=0;i<count;i++){
    let bonus = 0, prefix = '';
    while(true){
      $('who').textContent = bonus>0 ? `${name}: бонусний прокрут!`
        : (count>1 ? `${name} крутить рулетку (${i+1}/${count})` : `${name} крутить рулетку`);
      if(!first){ win.style.opacity=0; await sleep(400); }
      const items = build(bonus < MAX_BONUS);
      if(first){ stage.classList.add('on'); await sleep(1000); first=false; }   // плавна поява
      else await sleep(400);
      const prize = await go(items);
      if(prize.extra){ prefix += prize.name + ' → '; bonus++; await sleep(2500); continue; }  // ще раз
      prizes.push(prefix + prize.name); break;
    }
    if(i<count-1) await sleep(2500);                          // показуємо виграш перед наступним
  }
  // Один результат на всі прокрути, і тільки після зупинки останнього
  send({type:'result', id, prizes, donor:name, amount, count});
  await sleep(5000);
  stage.classList.remove('on'); await sleep(1000);
  busy = false; next();
}
function next(){ if(!busy && queue.length) run(queue.shift()); }
function enqueue(d){ queue.push(d); next(); }

/* ===== WebSocket до приймача (relay.js) ===== */
let ws;
let wsText = '';
function renderSt(){
  $('st').textContent = 'WS: ' + wsText + (VOL===0 ? ' | звук вимкнено' :
    ' | звук: ' + (actx && actx.state==='running' ? 'увімкнено' : 'клікни по сторінці'));
}
function status(t){ wsText = t; renderSt(); }
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => status('підключено до приймача');
  ws.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch{ return; }
    if(m && m.widget==='roulette') enqueue({id:m.id, name:m.name, amount:m.amount, count:m.count});
  };
  ws.onclose = () => { status('немає зв\u2019язку, пробую знову…'); setTimeout(connect, 3000); };
}
connect();

/* ===== Тест ===== */
if (P.has('test')) document.body.classList.add('t');
const t = () => enqueue({id:'local-'+Date.now(), name:'Тестер', amount:25, count:Number(P.get('count'))||1});
$('test').onclick = t;
addEventListener('keydown', e => { if(e.key==='t'||e.key==='T') t(); });
</script>
