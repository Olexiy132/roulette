<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Рулетка завдань</title>
<style>
  /* Прозорий фон для OBS */
  html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}
  #stage{position:fixed;left:50%;top:50%;width:1100px;transform:translate(-50%,-50%) scale(var(--s,1));opacity:0;transition:opacity .9s ease}
  #stage.on{opacity:1}
  #who{color:#fff;font-size:26px;font-weight:700;text-align:center;margin-bottom:10px;text-shadow:0 2px 6px #000}
  #win{transition:opacity .35s;position:relative;height:190px;overflow:hidden;border:3px solid #2b2f3a;border-radius:10px;background:#12141b}
  #win::before,#win::after{content:"";position:absolute;top:0;bottom:0;width:140px;z-index:2;pointer-events:none}
  #win::before{left:0;background:linear-gradient(90deg,#12141b,transparent)}
  #win::after{right:0;background:linear-gradient(270deg,#12141b,transparent)}
  #pointer{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#ffd23f;z-index:3;box-shadow:0 0 12px #ffd23f}
  #strip{display:flex;height:100%;will-change:transform}
  .it{flex:0 0 170px;box-sizing:border-box;margin:0;padding:14px 10px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:20px;font-weight:600;border-right:2px solid #12141b;border-bottom:6px solid var(--c);background:linear-gradient(180deg,#1b1e29,color-mix(in srgb,var(--c) 28%,#1b1e29))}
  .it.w{outline:4px solid #ffd23f;outline-offset:-4px;filter:brightness(1.3)}
  #res{color:#ffd23f;font-size:30px;font-weight:800;text-align:center;margin-top:14px;min-height:40px;text-shadow:0 2px 8px #000}
  #test{position:fixed;left:8px;bottom:8px;display:none}
  body.t #test{display:block}
  #st{position:fixed;left:8px;top:8px;font:12px Arial,sans-serif;color:#888;display:none}
  body.t #st{display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="who"></div>
  <div id="win"><div id="pointer"></div><div id="strip"></div></div>
  <div id="res"></div>
</div>
<div id="st"></div>
<button id="test">Тест (T)</button>

<script>
/* ===== НАЛАШТУВАННЯ ===== */
const P = new URLSearchParams(location.search);
// Адреса WebSocket приймача (relay.js). Параметр ?ws=wss://твоя-адреса.ngrok-free.dev/ws
const WS_URL = P.get('ws') || (location.protocol==='file:' ? 'ws://127.0.0.1:3000/ws'
              : (location.protocol==='https:' ? 'wss://' : 'ws://') + location.host + '/ws');
const SPIN_MS  = 7000;
// weight = шанс випадіння (чим більше, тим частіше). Замін на свої завдання.
const PRIZES = [
  {name:'Планка 30 секунд',           w:30, c:'#5b8def'},
  {name:'Спробуй ще',                 w:19, c:'#5b8def'},
  {name:'25 віджимань',                w:25, c:'#5b8def'},
  {name:'Плюс 30хв стріму',             w:15, c:'#9b5bef'},
  {name:'Нічо не виграв',             w:12, c:'#9b5bef'},
  {name:'Виконую бажання',            w:8,  c:'#ef5bd0'},
  {name:'Доначу вам 50 гривень',       w:6,  c:'#ef5bd0'},
  {name:'Присідаю 50 разів',          w:3, c:'#ffb020'},
  {name:'Танцюю під ваш трек',         w:1,  c:'#ffb020'}
];
/* ========================= */

const $ = id => document.getElementById(id);
const strip=$('strip'), stage=$('stage'), win=$('win');
const total = PRIZES.reduce((a,p)=>a+p.w,0);
const pick = () => { let r=Math.random()*total; for(const p of PRIZES){ if((r-=p.w)<0) return p; } return PRIZES[0]; };

const queue=[]; let busy=false;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function fit(){ $('stage').style.setProperty('--s', Math.min(1, innerWidth/1140)); }
addEventListener('resize', fit); fit();

function build(){
  const items = Array.from({length:80}, pick);
  strip.style.transition='none'; strip.style.transform='translateX(0)';
  strip.innerHTML = items.map(p=>`<div class="it" style="--c:${p.c}">${p.name}</div>`).join('');
  $('res').textContent=''; win.style.opacity=1;
  return items;
}
// Крутить стрічку і повертає приз тільки коли вона ПОВНІСТЮ зупинилась
async function go(items){
  await sleep(700);
  const iw = 170, stopIdx = 55 + Math.floor(Math.random()*15);
  const target = stopIdx*iw + Math.random()*(iw-16) + 8;   // точка під стрілкою
  const shift  = target - win.clientWidth/2;
  const stopped = new Promise(res => {
    let fin=false;
    const done = () => { if(!fin){ fin=true; strip.removeEventListener('transitionend', h); res(); } };
    const h = e => { if(e.target===strip && e.propertyName==='transform') done(); };
    strip.addEventListener('transitionend', h);
    setTimeout(done, SPIN_MS + 2000);                       // запасний варіант
  });
  strip.getBoundingClientRect();
  strip.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.12,.6,.1,1)`;
  strip.style.transform  = `translateX(${-shift}px)`;
  await stopped;
  await sleep(700);                                          // пауза: бачимо, що точно зупинилось
  const prize = items[stopIdx];
  strip.children[stopIdx].classList.add('w');
  $('res').textContent = prize.name;
  return prize;
}
async function run({id, name='Хтось', amount=0, count=1}){
  busy = true;
  count = Math.max(1, Math.min(5, Number(count)||1));
  const prizes = [];
  for(let i=0;i<count;i++){
    $('who').textContent = count>1 ? `${name} крутить рулетку (${i+1}/${count})` : `${name} крутить рулетку`;
    if(i>0){ win.style.opacity=0; await sleep(400); }
    const items = build();
    if(i===0){ stage.classList.add('on'); await sleep(1000); }   // плавна поява
    else await sleep(400);
    prizes.push((await go(items)).name);
    if(i<count-1) await sleep(2500);                              // показуємо виграш перед наступним
  }
  // Один результат на всі спіни, і тільки після зупинки останнього
  send({type:'result', id, prizes, donor:name, amount, count});
  await sleep(5000);
  stage.classList.remove('on'); await sleep(1000);
  busy = false; next();
}
function next(){ if(!busy && queue.length) run(queue.shift()); }
function enqueue(d){ queue.push(d); next(); }

/* ===== WebSocket до Streamer.bot ===== */
let ws;
function status(t){ $('st').textContent = 'WS: ' + t; }
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => status('підключено до приймача');
  ws.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch{ return; }
    if(m && m.widget==='roulette') enqueue({id:m.id, name:m.name, amount:m.amount, count:m.count});
  };
  ws.onclose = () => { status('немає зв\u2019язку, пробую знову…'); setTimeout(connect, 3000); };
}
connect();

/* ===== Тест ===== */
if (P.has('test')) document.body.classList.add('t');
const t = () => enqueue({id:'local-'+Date.now(), name:'Тестер', amount:25, count:Number(P.get('count'))||1});
$('test').onclick = t;
addEventListener('keydown', e => { if(e.key==='t'||e.key==='T') t(); });
</script>
</body>
</html>
